<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DataEdge Backtest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toolbar">
        <div class="tool-group">
            <button onclick="toggleTheme()">🌓</button>
            <button onclick="toggleGrid()">Grid</button>
        </div>
        <div class="tool-group" id="drawing-tools">
            <button id="btn-trendline" onclick="DrawingManager.setMode('trendline')">🖊️ Ligne</button>
            <button onclick="window.chart.timeScale().fitContent()">🔄 Reset</button>
        </div>
        <div class="tool-group">
            <input type="color" id="upColor" value="#00FFFF" onchange="updateColors()">
            <input type="color" id="downColor" value="#FF007F" onchange="updateColors()">
        </div>
    </div>

    <div id="chart-container">
        <div class="tv-scale-angle-zone">
            <div class="price-scale-controls">
                <button id="btn-percent-scale" onclick="/*...*/">P</button>
                <button id="btn-log-scale" onclick="/*...*/">L</button>
                <button id="btn-auto-scale" class="active" onclick="toggleAutoScale()">A</button>
            </div>
        </div>
    </div>

    <div id="debug-console"></div>

    <script src="lightweight-charts.js"></script>
	<script src="drawing_plugin.js"></script>
	<script src="drawing_manager.js"></script>
    <script src="chart_engine.js"></script>
</body>
</html>
